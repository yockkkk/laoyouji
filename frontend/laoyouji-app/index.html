<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' &&
        (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />'
      )
    </script>
    <!-- 地图不再引入高德 JS SDK：本机浏览器连不上高德控制面域名，SDK 出不了底图。
         改由 src/utils/amap.js 的 loadLeaflet() 在长辈端/子女端地图页按需动态加载
         Leaflet + 高德栅格瓦片（wprd0X.is.autonavi.com），其余页面不受牵连、更轻。 -->
    <title>老友记</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
