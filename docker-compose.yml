services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laoyouji-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend/laoyouji-app
      dockerfile: Dockerfile
    container_name: laoyouji-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - VITE_BACKEND_TARGET=http://backend:8000
    volumes:
      - ./frontend/laoyouji-app:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: laoyouji-network
